<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservar servicio</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; }
        .container { max-width: 700px; margin: 48px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
        form { display: grid; gap: 14px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        button { background: #16a34a; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; }
        a { text-decoration: none; color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Reservar: {{ offer.title }}</h1>
        <p><strong>Paseador:</strong> {{ offer.walker.get_full_name|default:offer.walker.username }}</p>
        <p><strong>Ciudad:</strong> {{ offer.city }}</p>
        <p><strong>Precio:</strong> ${{ offer.price }}</p>
        <p><strong>Descripción:</strong> {{ offer.description }}</p>

        <form method="post">
            {% csrf_token %}
            <input type="date" name="date" required>
            <input type="time" name="time" required>
            <textarea name="notes" rows="4" placeholder="Instrucciones o detalles para el paseador"></textarea>
            <button type="submit">Confirmar reserva</button>
        </form>
        <p><a href="/">Volver al inicio</a></p>
    </div>
</body>
</html>
