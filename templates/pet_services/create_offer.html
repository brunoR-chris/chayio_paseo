{% extends 'base.html' %}
{% block title %}Publicar servicio | Chayio{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16">
    <section class="mx-auto max-w-3xl rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft md:p-8">
        <div class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-brand-500">Comparte tu experiencia</div>
        <h1 class="text-4xl font-black tracking-[-0.06em] text-slate-900">Publicar servicio de paseo</h1>
        <p class="mt-3 text-slate-600">Presenta tu propuesta para que las familias te encuentren.</p>

        <form method="post" class="mt-6 grid gap-4 md:grid-cols-2">
            {% csrf_token %}
            <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Título del servicio</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="text" name="title" required>
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Descripción</label>
                <textarea class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" name="description" rows="4" required></textarea>
            </div>
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Precio</label>
                <div class="flex">
                    <span class="inline-flex items-center rounded-l-2xl border border-r-0 border-slate-200 bg-slate-100 px-4 text-slate-500">$</span>
                    <input class="w-full rounded-r-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="number" step="0.01" name="price" required>
                </div>
            </div>
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Duración (minutos)</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="number" name="duration_minutes" value="60" min="1">
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Ciudad</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="text" name="city" required>
            </div>
            <div class="md:col-span-2 mt-2 flex flex-wrap items-center gap-3">
                <button class="rounded-full bg-brand-500 px-5 py-3 text-sm font-bold text-white transition hover:bg-brand-700" type="submit">Crear servicio</button>
                <a class="text-sm font-semibold text-slate-600" href="{% url 'dashboard' %}">Cancelar</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
