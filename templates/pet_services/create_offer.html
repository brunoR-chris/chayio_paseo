{% extends 'base.html' %}
{% block title %}Publicar servicio | Chayio{% endblock %}
{% block content %}<div class="container"><section class="form-card"><div class="eyebrow mb-2">Comparte tu experiencia</div><h1>Publicar servicio de paseo</h1><p class="text-secondary">Presenta tu propuesta para que las familias te encuentren.</p><form method="post" class="row g-3 mt-2">{% csrf_token %}<div class="col-12"><label class="form-label">Título del servicio</label><input class="form-control" type="text" name="title" required></div><div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="description" rows="4" required></textarea></div><div class="col-md-6"><label class="form-label">Precio</label><div class="input-group"><span class="input-group-text">$</span><input class="form-control" type="number" step="0.01" name="price" required></div></div><div class="col-md-6"><label class="form-label">Duración (minutos)</label><input class="form-control" type="number" name="duration_minutes" value="60" min="1"></div><div class="col-12"><label class="form-label">Ciudad</label><input class="form-control" type="text" name="city" required></div><div class="col-12"><button class="btn btn-primary" type="submit">Crear servicio</button><a class="btn btn-link" href="{% url 'dashboard' %}">Cancelar</a></div></form></section></div>{% endblock %}
