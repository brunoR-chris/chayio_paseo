{% extends 'base.html' %}
{% block title %}Reserva enviada | Chayio{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16">
    <section class="mx-auto max-w-xl rounded-[28px] border border-slate-200 bg-white p-8 text-center shadow-soft">
        <div class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-brand-500">Solicitud enviada</div>
        <h1 class="text-4xl font-black tracking-[-0.06em] text-slate-900">Reserva pendiente de confirmación</h1>
        <p class="mt-3 text-slate-600">Tu solicitud para <strong>{{ offer.title }}</strong> fue enviada al paseador. Te avisaremos cuando la acepte.</p>
        <a class="mt-6 inline-flex rounded-full bg-brand-500 px-5 py-3 text-sm font-bold text-white transition hover:bg-brand-700" href="{% url 'dashboard' %}">Ver mis reservas</a>
    </section>
</div>
{% endblock %}
