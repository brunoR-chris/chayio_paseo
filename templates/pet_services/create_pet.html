{% extends 'base.html' %}
{% block title %}Registrar mascota | Chayio{% endblock %}
{% block content %}<div class="container"><section class="form-card"><div class="eyebrow mb-2">Tu compañero</div><h1>Registrar mascota</h1><p class="text-secondary">Cuéntanos un poco sobre quien disfrutará el paseo.</p><form method="post" class="row g-3 mt-2">{% csrf_token %}<div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" type="text" name="name" required></div><div class="col-md-6"><label class="form-label">Especie</label><input class="form-control" type="text" name="species" placeholder="Perro, gato..." required></div><div class="col-md-6"><label class="form-label">Raza</label><input class="form-control" type="text" name="breed"></div><div class="col-md-6"><label class="form-label">Edad en años</label><input class="form-control" type="number" name="age" min="0"></div><div class="col-12"><label class="form-label">Observaciones o cuidados especiales</label><textarea class="form-control" name="notes" rows="4"></textarea></div><div class="col-12 form-check ms-2"><input class="form-check-input" type="checkbox" name="available" id="available" checked><label class="form-check-label" for="available">Disponible para solicitar un paseo</label></div><div class="col-12"><button class="btn btn-primary" type="submit">Guardar mascota</button><a class="btn btn-link" href="{% url 'dashboard' %}">Cancelar</a></div></form></section></div>{% endblock %}
