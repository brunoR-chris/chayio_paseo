<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar mascota</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; margin: 0; }
        .container { max-width: 700px; margin: 48px auto; background: white; padding: 28px; border-radius: 16px; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
        form { display: grid; gap: 14px; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #cbd5e1; box-sizing: border-box; }
        button { background: #2563eb; color: white; border: none; padding: 12px 18px; border-radius: 8px; cursor: pointer; }
        a { text-decoration: none; color: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registrar mascota</h1>
        <form method="post">
            {% csrf_token %}
            <input type="text" name="name" placeholder="Nombre" required>
            <input type="text" name="species" placeholder="Especie (perro, gato, etc.)" required>
            <input type="text" name="breed" placeholder="Raza">
            <input type="number" name="age" placeholder="Edad en años">
            <textarea name="notes" rows="4" placeholder="Observaciones o cuidados especiales"></textarea>
            <label><input type="checkbox" name="available" checked> Disponible para solicitar un paseo</label>
            <button type="submit">Guardar mascota</button>
        </form>
        <p><a href="/dashboard/">Volver al dashboard</a></p>
    </div>
</body>
</html>
