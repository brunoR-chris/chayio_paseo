{% extends 'base.html' %}
{% block title %}Registrar mascota | Chayio{% endblock %}
{% block content %}
<div class="container mx-auto px-4 py-16">
    <section class="mx-auto max-w-3xl rounded-[28px] border border-slate-200 bg-white p-6 shadow-soft md:p-8">
        <div class="mb-2 text-xs font-bold uppercase tracking-[0.18em] text-brand-500">Tu compañero</div>
        <h1 class="text-4xl font-black tracking-[-0.06em] text-slate-900">Registrar mascota</h1>
        <p class="mt-3 text-slate-600">Cuéntanos un poco sobre quién disfrutará el paseo.</p>

        <form method="post" class="mt-6 grid gap-4 md:grid-cols-2">
            {% csrf_token %}
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Nombre</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="text" name="name" required>
            </div>
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Especie</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="text" name="species" placeholder="Perro, gato..." required>
            </div>
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Raza</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="text" name="breed">
            </div>
            <div>
                <label class="mb-2 block text-sm font-semibold text-slate-700">Edad en años</label>
                <input class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" type="number" name="age" min="0">
            </div>
            <div class="md:col-span-2">
                <label class="mb-2 block text-sm font-semibold text-slate-700">Observaciones o cuidados especiales</label>
                <textarea class="w-full rounded-2xl border border-slate-200 bg-slate-50 px-4 py-3 outline-none focus:border-brand-500 focus:bg-white focus:ring-4 focus:ring-brand-100" name="notes" rows="4"></textarea>
            </div>
            <div class="md:col-span-2 flex items-center gap-2">
                <input class="h-4 w-4 rounded border-slate-300 text-brand-500 focus:ring-brand-500" type="checkbox" name="available" id="available" checked>
                <label class="text-sm font-semibold text-slate-700" for="available">Disponible para solicitar un paseo</label>
            </div>
            <div class="md:col-span-2 mt-2 flex flex-wrap items-center gap-3">
                <button class="rounded-full bg-brand-500 px-5 py-3 text-sm font-bold text-white transition hover:bg-brand-700" type="submit">Guardar mascota</button>
                <a class="text-sm font-semibold text-slate-600" href="{% url 'dashboard' %}">Cancelar</a>
            </div>
        </form>
    </section>
</div>
{% endblock %}
