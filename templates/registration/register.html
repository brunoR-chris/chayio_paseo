<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta - Chayio</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background: #f6f8fc; color: #1f2937; }
        .page { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        .card { width: min(100%, 560px); background: white; border-radius: 14px; padding: 32px; box-shadow: 0 6px 18px rgba(15,23,42,.08); }
        h1 { margin-top: 0; color: #0f172a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        .field { margin-top: 16px; }
        .full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input, select, textarea { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #cbd5e1; border-radius: 8px; font: inherit; }
        textarea { resize: vertical; }
        .help, .errorlist { color: #64748b; font-size: .9rem; }
        .errorlist { color: #b91c1c; padding-left: 18px; }
        button { width: 100%; border: 0; background: #2563eb; color: white; padding: 13px; border-radius: 8px; margin-top: 24px; font: inherit; font-weight: bold; cursor: pointer; }
        a { color: #2563eb; }
        @media (max-width: 620px) { .grid { grid-template-columns: 1fr; } .full { grid-column: auto; } }
    </style>
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Crear cuenta</h1>
            <p>Elige cómo quieres usar Chayio.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.non_field_errors }}
                <div class="grid">
                    {% for field in form %}
                        <div class="field{% if field.name == 'bio' or field.name == 'username' or field.name == 'password1' or field.name == 'password2' %} full{% endif %}">
                            {{ field.errors }}
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% if field.help_text %}<div class="help">{{ field.help_text }}</div>{% endif %}
                        </div>
                    {% endfor %}
                </div>
                <button type="submit">Crear cuenta e iniciar sesión</button>
            </form>
            <p><a href="{% url 'login' %}">Ya tengo una cuenta</a></p>
        </section>
    </main>
</body>
</html>
